<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2026 SRA Hackathon Portal</title>
<style>
:root{
  --ink:#15181d; --ink-2:#4a5159; --ink-3:#858d96;
  --bg:#f6f7f9; --card:#ffffff; --line:#e4e7eb;
  --accent:#EE4D2D; --accent-soft:#fdeeea;
  --r:10px;
  --sans:"Inter","PingFang SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px 64px}
a{color:inherit}
/* header */
header{background:#0f1216;color:#fff;padding:28px 0 22px;margin-bottom:22px}
header .wrap{padding-bottom:0}
.htop{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
h1{margin:0;font-size:26px;letter-spacing:-.02em;font-weight:650}
.sub{margin:6px 0 0;font-size:13px;color:#9aa3ad}
.langbtn{background:transparent;border:1px solid #39404a;color:#dfe3e8;border-radius:999px;padding:6px 14px;font-size:12px;cursor:pointer;font-family:inherit}
.langbtn:hover{border-color:var(--accent);color:#fff}
.stats{display:flex;gap:26px;flex-wrap:wrap;margin-top:20px}
.stat b{display:block;font-size:24px;font-weight:650;letter-spacing:-.02em}
.stat span{font-size:12px;color:#9aa3ad}
/* tabs */
nav{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:22px;flex-wrap:wrap}
nav button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;font-size:14px;color:var(--ink-2);cursor:pointer;font-family:inherit;margin-bottom:-1px}
nav button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:12px}
.trackcard{border-left:4px solid var(--tc,#ccc)}
.tname{font-weight:650;font-size:15px;margin:0}
.tname small{color:var(--ink-3);font-weight:400}
.tdesc{color:var(--ink-2);margin:8px 0 0;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--ink-2);cursor:pointer}
.chip:hover{border-color:var(--accent);color:var(--accent)}
/* filters */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.fbtn{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 13px;font-size:12.5px;cursor:pointer;font-family:inherit;color:var(--ink-2)}
.fbtn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
input[type=search]{flex:1;min-width:170px;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13px;font-family:inherit;background:var(--card)}
input[type=search]:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
/* team */
.team{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.thead{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;cursor:pointer}
.tno{flex:none;width:26px;height:26px;border-radius:7px;background:var(--bg);color:var(--ink-3);font-size:11.5px;display:flex;align-items:center;justify-content:center;font-weight:600;margin-top:1px}
.tmain{flex:1;min-width:0}
.tt{font-weight:650;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tdot{width:7px;height:7px;border-radius:50%;flex:none}
.tsol{color:var(--ink-2);font-size:13px;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--ink-3)}
.cap{color:var(--ink-2)}
.cap b{font-weight:600;color:var(--ink)}
.caret{flex:none;color:var(--ink-3);font-size:12px;margin-top:4px;transition:transform .15s}
.team.open .caret{transform:rotate(90deg)}
.tbody{display:none;border-top:1px solid var(--line);padding:14px 16px 16px;background:#fcfcfd}
.team.open .tbody{display:block}
.fld{margin-bottom:12px}
.fld h4{margin:0 0 4px;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.fld p{margin:0;white-space:pre-wrap;font-size:13px;color:var(--ink-2)}
.mlist{display:flex;flex-wrap:wrap;gap:6px}
.mem{background:#fff;border:1px solid var(--line);border-radius:6px;padding:4px 9px;font-size:12px}
.mem.lead{border-color:var(--accent);background:var(--accent-soft)}
.mem span{color:var(--ink-3)}
/* demo week */
.day{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.dhead{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.ddate{font-weight:650;font-size:16px;min-width:112px}
.ddate em{font-style:normal;color:var(--ink-3);font-weight:400;font-size:13px;margin-left:6px}
.dtrack{font-size:12.5px;color:var(--ink-2);flex:1}
.dcount{font-size:12px;color:var(--ink-3);white-space:nowrap}
.tent{background:#fff6e5;color:#9a6b00;border:1px solid #f0dcae;border-radius:999px;font-size:11px;padding:2px 8px;white-space:nowrap}
.dbody{display:none;border-top:1px solid var(--line);padding:6px 16px 14px;background:#fcfcfd}
.day.open .dbody{display:block}
.slot{display:flex;gap:12px;align-items:baseline;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13px}
.slot:last-child{border-bottom:0}
.slot .sn{color:var(--ink-3);font-size:12px;width:22px;flex:none}
.slot .snm{font-weight:600;min-width:150px}
.slot .sc{color:var(--ink-2);font-size:12.5px;flex:1}
.slot .sl{color:var(--ink-3);font-size:12px;white-space:nowrap}
.note{font-size:12px;color:var(--ink-3);margin:14px 0 0}
.empty{color:var(--ink-3);padding:24px;text-align:center}
@media(max-width:640px){
  .slot{flex-wrap:wrap;gap:4px 10px}
  .ddate{min-width:auto}
  h1{font-size:21px}
}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="htop">
    <div>
      <h1>2026 SRA Hackathon</h1>
      <p class="sub" id="sub"></p>
    </div>
    <button class="langbtn" id="lang">EN</button>
  </div>
  <div class="stats" id="stats"></div>
</div></header>

<div class="wrap">
  <nav id="nav"></nav>
  <div id="view"></div>
</div>

<script>
const DATA = {"teams": [{"id": 1, "track": 1, "name": "相关性分析助手", "title": "构建一个统一的搜索相关性分析平台，整合 GRM 趋势看板、bad query 归因分析、LLM 自动分析和 QIR 模型 debug，支持日常监控、问题排查与效果跟进。", "problem": "搜索相关性分析、bad query 归因和模型 debug 目前分散在不同脚本和数据源中，排查链路长、效率低，也缺少统一的可视化和自动分析入口", "approach": "搭建统一的 Relevance Agent 网站，整合 GRM 趋势、bad query 归因、LLM 分析和 QIR debug；通过定时数据刷新和在线分析能力，支持问题监控、原因定位和 case 排查。", "impact": "如果方案落地，可显著降低相关性问题排查成本，缩短从发现问题到定位原因的时间；提升 GRM 趋势监控、bad query 归因和模型 debug 的效率，帮助团队更快推进问题闭环和效果跟进。", "subteam": "Search", "loc": "BJ / SH / SG", "cap": "Ericbo Chen (陈博)", "members": [["Ericbo Chen (陈博)", "Search / Algo / BJ"], ["Su Peng (苏鹏)", "Search / Algo / SH"], ["Huang Juntang", "Search / BE&DE / SG"]], "size": 3}, {"id": 2, "track": 1, "name": "别急，我在查了", "title": "直播case智能排查助手", "problem": "local返回的case长时间处于难定位、无头绪、排查慢的问题，对于新人来说很难排查。这个agent将集成排查经验和排查思路迅速定位到问题。", "approach": "搭建一站式排查链路，快速、高效、精准的诊断和排查case成因", "impact": "解放排查case的人力投入，让不熟悉链路的人也能够快速知道case成因", "subteam": "RCMD", "loc": "SZ", "cap": "Hu Zenan (胡泽南)", "members": [["Hu Zenan (胡泽南)", "RCMD / Algo / SZ"], ["Li Xueyu (李雪玉)", "RCMD / Algo / SZ"]], "size": 2}, {"id": 3, "track": 1, "name": "RCMD Debug Agent", "title": "RCMD holdout/aa/tc 异常诊断和分析", "problem": "holdout 和 aa 经常出问题，需要耗费大量的人力去定位问题", "approach": "把 rcmd 知识库、网站监控、全链路数据、实时工具组织成可验证的 Evidence，并通过 Playbook、Verifier 和 Answer Validator 约束 RCA 输出", "impact": "debug agent 将极大的提升业务异常定位的准确性，且能实现异常预警和分析一体化", "subteam": "RCMD", "loc": "SH / BJ / SG", "cap": "Zheng Kailun (郑凯伦)", "members": [["Zheng Kailun (郑凯伦)", "RCMD / Algo / SH"], ["Wang Peijian (王培建)", "RCMD / Algo / BJ"], ["Wen Haowh (文豪)", "RCMD / Algo / BJ"], ["Yang Sen (杨森)", "RCMD / Algo / BJ"], ["Lee Te-Wei", "RCMD / Algo / SG"]], "size": 5}, {"id": 4, "track": 1, "name": "ROI3 Guardian", "title": "ROI3 Guardian: Real-time Diagnosis and Strategy Repair Agent", "problem": "ROI3 发券策略依赖实时数据、调控参数、uplift 模型预估、索引召回、发券执行和预算消耗等多个模块。线上异常发生时，目前主要靠人工发现问题、跨系统定位原因，再决定是否降预算、调校准系数、切保守策略或做其他止损操作。这个链路响应慢，尤其在消耗跑飞、模型预估偏移、索引异常或调控参数异常时，可能错过第一时间止损窗口。", "approach": "构建一个 ROI3 实时稳定性 Agent，覆盖“监控、诊断、预案选择、止损执行建议”的闭环。\nAgent 接入 Ultra Core 实时数据、调控日志、uplift 模型数据、发券与消耗数据、索引和关键链路日志，按 region / bucket / strategy version 等维度监控发券率、voucher cost、ROI、预算消耗节奏、uplift 分布、索引命中和策略参数变化。\n发现异常后，Agent 先判断异常来源更可能属于数据延迟、调控参数、模型预估、索引覆盖、发券执行或预算节奏问题。随后不生成复杂新策略，而是从预先配置好的应急组合措施中选择是否启动、启动哪一组，例如：\n降低预算或收紧预算消耗节奏\n通过校准系数压低模型预估，防止消耗跑飞\n对异常 region / bucket 切换保守发券强度\n对异常策略版本做临时降级或暂停\n对索引异常场景启用兜底保护规则\n每个应急组合措施都提前定义触发条件、适用范围、最大影响、回滚条件和审批方式。Agent 负责判断、解释和推荐，必要时由人审后执行，避免黑盒自动决策。\n\n我们不会让 Agent 黑盒生成复杂线上策略，而是提供一组经过预定义和审核的应急组合措施。Agent 的核心价值是实时判断异常是否需要止损、应该启动哪一个预案，并给出清晰的原因、影响范围和回滚建议。", "impact": "如果成功，ROI3 线上稳定性保障可以从“人工发现、人工判断、人工止损”升级为“自动发现、自动归因、自动推荐止损预案”。预期可以降低异常发现延迟，缩短第一层止损时间，减少预算消耗跑飞、发券成本异常、模型预估偏移和索引问题带来的线上风险。\n可量化指标包括：异常发现延迟下降、平均诊断时间下降、第一层止损响应时间下降、人工重复排查次数下降、关键 ROI3 异常场景的预案覆盖率提升。", "subteam": "Ads", "loc": "BJ", "cap": "Roger Li", "members": [["Roger Li", "Ads / Algo / BJ"], ["Peng Haoran (彭浩然)", "Ads / Algo / BJ"], ["Zhang Kaiyu (张凯昱)", "Ads / Algo / BJ"], ["Luo Yijing (罗一京)", "Ads / Algo / BJ"], ["Cai Yiwei (蔡奕维)", "Ads / Algo / BJ"]], "size": 5}, {"id": 5, "track": 1, "name": "SMITH值班搭子", "title": "Agent SMITH v2.0：从被动排查到主动值班伙伴", "problem": "当前 SMITH 主要仍是“人问 Agent 答”的被动排查模式，只有工程师主动发起对话后才会开始工作。面对监控告警、发版观察、定时巡检、Jira 工单等高频场景，值班同学仍需手动发现问题、复制上下文、拉取指标、整理初判并持续跟进。与此同时，排查过程中的经验难以自动沉淀，历史结论与最终 Jira resolution 也没有形成闭环，导致重复劳动多、首响慢、误判难纠正，Agent 还不能真正成为稳定可靠的值班伙伴。", "approach": "基于路线图 v2.0，我们计划把 SMITH 升级为“自治化值班伙伴”。第一，建设统一 Event Trigger 框架，接入 Grafana/Lark 告警、ECP 发版事件、Cron 巡检和 Jira Webhook，实现“事件发生即自动响应”，由 Agent 自动做分诊、拉取指标、执行标准排查流程，并把初步分析推送到对应渠道。第二，建设自动记忆总结、提炼与反思能力，在每次排查后自动生成结构化案例摘要，定期聚类提炼高频问题模式，并把 Jira 最终结论反哺到记忆中，持续修正错误经验。第三，建设问题 follow-up 闭环能力，自动跟踪 Jira ticket 状态变化，在 Resolved、Reopened、Closed 等节点触发不同动作，完成结论校正、相似问题关联和月度效能分析。整体上形成“触发-排查-学习-跟进”的闭环自治系统。", "impact": "如果方案落地，SMITH 将从一个被动问答工具升级为可主动感知、主动分诊、主动跟进的值班伙伴。预期可以把“告警到初判时间”缩短到 1 分钟以内，把平均排查时间从当前分钟级进一步压缩到 3 分钟以内；通过自动总结与 Jira 闭环纠正，把排查准确率提升到 92% 以上，并实现 80% 以上 ticket 的结论闭环纠正覆盖；对误报告警可实现 70% 以上的自动识别与标记，减少值班噪音。同时，团队会沉淀持续演进的排查知识库和问题模式库，降低新人上手成本，减少重复性人工排查工作，提高整体 oncall 效率和系统稳定性。", "subteam": "Search", "loc": "SG / SH", "cap": "Wang Bofan", "members": [["Wang Bofan", "Search / BE / SG"], ["Zi Yunlong (字云龙)", "Search / BE / SH"], ["Zuo Fangcheng (左方成)", "Search / BE / SH"]], "size": 3}, {"id": 6, "track": 1, "name": "农场主John和她的火鸡们", "title": "快速评估模型多项指标，定位模型问题", "problem": "模型指标多、难以凭借单一指标判断效果，了解效果后难以快速定位问题和优化点", "approach": "评估指标矩阵构建 -> 预估值分布分析 -> 参数/结构分析，逐层诊断", "impact": "降低人工评估和查找模型问题成本，模型迭代次数减少50%，4个版本内拿到模型优化的正向离线结论。", "subteam": "Ads", "loc": "BJ / SZ", "cap": "Liu Yuehan (刘玥涵)", "members": [["Liu Yuehan (刘玥涵)", "Ads / Algo / BJ"], ["Wu Siqi (伍思琦)", "Ads / Algo / BJ"], ["Wei Jingyi (魏静怡)", "Ads / Algo / SZ"]], "size": 3}, {"id": 7, "track": 1, "name": "TraceRank", "title": "ads推荐排序的可解释性白盒化", "problem": "模型预估后在链路中各环节的使用方式不够清晰，导致无法得知为什么会曝光某个广告", "approach": "使用ads模型预估、出价、混排阶段的全链路日志，完整挖掘出曝光ads的可解释性", "impact": "缩短ads爆量、掉量的30%的排查时间；明确2个链路中可优化的问题", "subteam": "Ads", "loc": "BJ / SG", "cap": "Di Haibo (邸海波)", "members": [["Di Haibo (邸海波)", "Ads / Algo / BJ"], ["Zheming Cai (蔡哲明)", "Ads / Algo / BJ"], ["Cao Jian", "Ads / BE / SG"]], "size": 3}, {"id": 8, "track": 2, "name": "Autolab", "title": "Search Performance Autoresearch", "problem": "当前搜索链路的 latency 问题发现和优化高度依赖人工经验，信号分散在 metrics、trace、profile、log 和线上现象里，难以持续治理和复用。目标是把搜索性能治理从“专家手工排查 + 临时脚本验证”升级为“问题发现标准化 + 实验验证自动化 + evidence 可持续沉淀”的体系。", "approach": "Latency Kanban 负责把分散信号聚合成可消费的 latency issue card，帮助稳定发现和排序值得研究的问题。\n\nAutoresearch 负责把这些问题转成标准实验流程，通过 sample、replay、local-hit、profile、trace、diff gate、guardrail 和 proposal 沉淀，完成可复现、可验证的性能研究。", "impact": "自动发现并优化搜索性能问题，节省大量人日", "subteam": "Search", "loc": "SH", "cap": "Gavi Wu (吴佳维)", "members": [["Gavi Wu (吴佳维)", "Search / BE / SH"], ["Ding Yuxin (丁雨欣)", "Search / BE / SH"], ["Deng Xusai (邓徐赛)", "Search / BE / SH"]], "size": 3}, {"id": 9, "track": 2, "name": "Foregrade", "title": "根据预期流量预测大促未来负载，合理推荐降级预案和降级参数，在避免过载的同时减少过度降级带来的业务损失。", "problem": "大促期间流量峰值变化快，当前降级主要依赖人工经验和固定阈值：通常要等 CPU、latency、error rate 已经变差后才开始处理，响应慢且容易一刀切过度降级。\n这会带来两类问题：\n一是降级太晚，服务已经报错过载，造成业务损失；\n二是降级太重、持续太久，浪费资源并影响 CTR / CVR / order / GMV 等业务指标。", "approach": "- ​基于历史大促曲线、活动日历和实时水位，建立 capacity / risk model， agent loop 获取在线服务的指标，计算预测负载是否超过服务安全容量，预测未来 15 / 30 / 60 分钟的 QPS、CPU、latency 和风险等级。\n- ​先用历史大促数据回放验证决策质量；可选在 liveish 环境调用 plan-service 的 start / stop / rollback 能力证明链路可执行。\n- 降级执行后进入反馈闭环，将降级执行效果和服务指标收集，反馈调节预测模型/大模型Agent。", "impact": "- 提前量：相比人工操作或固定阈值规则，系统提前N分钟给出降级建议。\n  - 稳定性风险降低：预测中的 CPU / latency / error rate 高风险窗口减少。\n  - 防过度降级：当轻度降级足够时，减少 L3 / L4 这类高等级降级的使用时长。\n  - 资源收益估计：根据降级等级估算 CPU / QPS / 实例压力下降。\n  - 业务损失估计：根据每个降级动作的影响模型，估算 CTR / CVR / order / GMV 损失。", "subteam": "E&A + Search", "loc": "SZ / SG", "cap": "Liu Shiwei (刘诗伟)", "members": [["Liu Shiwei (刘诗伟)", "E&A + Search / BE / SZ"], ["Li Xinkun (李新琨)", "E&A + Search / QA / SZ"], ["Zhu Tiancheng (朱天成)", "E&A + Search / BE / SZ"], ["Jiang Xiwei", "E&A + Search / BE / SG"], ["Yu Mingkun (于明坤)", "E&A + Search / BE / SZ"]], "size": 5}, {"id": 10, "track": 2, "name": "ckpt diet club", "title": "使用 AI 探索减少model ckpt size 的方案", "problem": "减少 model ckpt size, 让算法同学可以保留更多版本 ckpt", "approach": "contents and encoding opt for single CKPT, embedding resue among CKPT chains", "impact": "预期 CKPT 减少 30% ~ 50%  storage size", "subteam": "EGO + RCMD", "loc": "SH / SG", "cap": "Gao Huaidong (高怀东)", "members": [["Gao Huaidong (高怀东)", "EGO / BE / SH"], ["Jingxi Liang", "RCMD / Algo / SG"], ["Sixiang Yang(杨思翔)", "EGO / BE / SG"]], "size": 3}, {"id": 11, "track": 2, "name": "AI chemist", "title": "Merge-Score Opt：面向线上 AB 实验的证据驱动调参 Agent，产出可直接映射到 Config Center 的 merge-score 调参建议。", "problem": "离线模型效果变好之后，直接套用线上 merge-score 公式不一定能转化为线上收益，原因包括不同地区/桶的公式语义不同、实验期间配置可能发生变化、线上 AB 指标和离线 AUC/score 分布之间存在偏差。当前主要依赖两类人工方式：\n1. 根据 AB 报表和经验判断调参方向；\n2. dump 在线 score 后做离线 Bayes 搜参。前者主观性强、可复现性弱，后者需要反复拉配置、查历史、导出 score、处理权限/导出失败、运行模拟并人工映射回线上公式，耗时长且容易出错。更关键的是，两类证据难以系统融合，Bayes 的最优参数也未必能直接发布到 Config Center，算法同学需要把大量时间花在重复性调参和证据整理上。", "approach": "设计一个参数调优 Agent，把一次线上 merge-score 调参沉淀成标准化、可审计的工作流。用户只需提供 region、bucket、实验开始时间等基础信息，Agent 会自动完成：\n1. 从 Grafana 对齐实验桶与基线桶的核心 score 均值，先识别 score 分布是否异常；\n2. 从 Config Center 读取实验桶实际使用的公式、引用的 Predictor 和配置历史，按配置变更切分 AB 分析窗口，避免把不同配置阶段的数据混在一起；\n3. 拉取 AB 明细并按天/配置稳定段分析目标指标和 guardrail；\n4. 默认 dump score 并进行分阶段 Bayes 搜参，要求覆盖完整日期窗口和足够样本量；\n5. 将线上 AB 症状、公式语义、离线 AUC/mean-score/top value 结果做综合判断，而不是机械采用 Bayes top1；\n6. 输出 3 个不同风险档位的 Config Center 可粘贴公式或精确参数调整，并校验目标 JSON path、当前值和共享配置风险。整个流程通过 hard completion gate、配置范围约束、凭证自动恢复和归档文档保证稳定性，也能通过历史运行结果持续迭代调参规则。", "impact": "如果成功，单次 merge-score 调参将从“人工拉 AB、查配置、导 score、跑模拟、整理建议”的串行流程，收敛为“一次输入实验信息，Agent 自动产出证据链和候选公式”的流程。预期影响包括：\n1. 人工重复操作时间从数小时到 1 天级，降低为主要做结果验收和业务判断；\n2. 首轮调参建议可以在同一天内产出，缩短线上 AB 后的公式迭代周期；\n3. 每个 region/bucket 固定输出 3 个可发布候选，并附带 AB 证据、离线指标、score 均值差异、配置路径和风险说明，降低经验调参和误改共享配置的风险；\n4. 支持多地区批量调参，并对每个 region 输出独立公式、离线覆盖率和置信度标记；\n5. 长期看，算法同学可以把更多时间投入模型结构和特征迭代，而不是重复处理调参数据链路。", "subteam": "Search", "loc": "SH", "cap": "Zhang Bozhb (张博)", "members": [["Zhang Bozhb (张博)", "Search / Algo / SH"], ["LiWenjie(李文杰)", "Search / Algo / SH"], ["Zhou Guoliang (周国亮)", "Search / Algo / SH"]], "size": 3}, {"id": 12, "track": 3, "name": "Seatalk数字分身", "title": "接入seatalk用真身风格处理工作", "problem": "1.日常DOD消息，线上告警，seatalk红点爆满，脑容量告急；翻消息爬楼了解背景，查grafana、查日志焦急等待，流程繁琐。组织语言打字回复用户，打多了费手，打少了解释不清楚还容易误会。\n2.线上紧急问题必须在电脑旁处理，路上接到报警电话到处联系人处理", "approach": "hook seatalk，监听个人/团队相关消息，拿到完整上下文建case，维护session，交给LLM。让分身从过往事件学习沉淀处理方法，从模拟真身到超越真身。规范分身职责边界，本地敏感文件、线上写操作只能是真身指挥下执行，事故定责类消息必须真人处理。", "impact": "1、95%日常DOD事件可以输出完整答案，剩下5%也可以输出中间物料，大幅减少DOD同学的压力\n2、可以基于seatalk对话总结周报，写代码，查监控，随时随地快速回复老板问题\n3、多种多样建case风格，老板私聊、用户群里at团队成员和任何地方真身召唤，分身都可以用礼貌专业的风格回复。\n4、在定义的边界内真身可以指挥分身做一些线上操作", "subteam": "EGO", "loc": "BJ / SG", "cap": "Arthur Hu (胡新华)", "members": [["Arthur Hu (胡新华)", "EGO / BE / BJ"], ["Li Junchen (李骏辰)", "EGO / BE / BJ"], ["Huang Shuquan", "EGO / BE / SG"]], "size": 3}, {"id": 13, "track": 3, "name": "Zion", "title": "Morf —— 自动组队、常驻在岗、能干专业活的 AI 同事团队。", "problem": "现有 AI 研发工具大多是\"被动工具\"：要人一步步指挥、开着才用、关了就停，单个 agent 也扛不住需要多角色协作的复杂任务。团队里大量\"重复却要专业判断\"的工作——MR 分诊、代码评审、补测试、跟进卡住的 PR、值守、周报——持续吃掉资深工程师的时间；而全自主 agent 又难取信、出问题难接管，只能推倒重来。", "approach": "Morf 是基于 Claude Agent SDK 的自托管多智能体系统，一条命令在团队自有服务器上常驻启动。它感知代码仓库（技术栈、流程、风险面），自动组建一支分工协作的团队（分诊、评审、执行、测试、汇报），每个成员都是一个可互相通信的活体 Claude 会话；以一个 SeaTalk 机器人作为统一对外身份，既能被 @ 派活，也会主动发现卡点、推进并汇报。合并、发布、改配置等高风险动作须经授权团队成员审批，自主而不失控。内置控制台可随时切入任一成员的会话接管、纠偏再放手，在人工与自主之间自由切换。", "impact": "把研发协作中重复的专业工作交给一支常驻 AI 团队。目标：将资深工程师在分诊/评审/测试/PR 跟进/周报上的投入降低 30–50%；首轮评审从\"小时/天级\"压到分钟级、MR 平均停留时长显著下降；提升评审与测试的一致性、更早发现问题；7×24 在岗、跨时区无缝交接，减少卡住与遗漏。（行业佐证：Anthropic 称其内部常驻 AI 同事现已贡献产品团队约 65% 的代码。）", "subteam": "E&A", "loc": "BJ / SZ", "cap": "Wu Lei (武雷)", "members": [["Wu Lei (武雷)", "E&A / FE / BJ"], ["Rich Bao (鲍涛)", "E&A / FE / SZ"], ["Chen Zifeng (陈子锋)", "E&A / FE / SZ"], ["Wang Xin (王鑫)", "E&A / FE / BJ"]], "size": 4}, {"id": 14, "track": 3, "name": "Torch Optim Agent Team", "title": "面向Torch训练与发布优化的 DAG 编排智能体团队", "problem": "Search Ranking 团队过去长期基于 TensorFlow 框架进行模型迭代，今年开始逐步迁移到 Torch，因此出现了大量需要重新适配、验证和优化的工作，包括训练配置、optimizer 行为、checkpoint lifecycle、feature 处理、runtime 稳定性和指标对齐等。\nTorch optimizer 相关优化实验通常涉及多个相互影响的环节，包括问题定位、历史实验记录分析、候选优化方向设计、实验配置检查、训练提交、运行监控、指标分析和经验沉淀。当前这些环节主要依赖人工串联，容易出现上下游信息丢失、变量混杂、实验归因不清、重复排查和经验无法复用的问题。\n在过去 Torch 迭代过程中，我们也积累了不少踩坑记录，例如 checkpoint 不兼容、feature slot 变更影响实验对比、optimizer state 或训练配置不一致、warmup 期指标误判、runtime 异常发现过晚等。这些问题往往不是模型思路本身错误，而是实验链路中的工程细节没有被系统化检查，导致后续团队成员可能反复踩同样的坑。", "approach": "构建一个面向 Torch optimization 的 Agent Team DAG，将完整优化流程拆解为多个职责清晰的 agent 节点：问题理解与方向判断、历史实验和日志证据整理、候选方案生成、实验设计、配置检查、训练监控、结果分析和知识沉淀。每个节点都有明确的输入、输出和依赖关系，由 DAG 统一编排，从而让 Torch optim workflow 可审计、可复现、可持续迭代。\n其中，实验前的检查节点会吸收过去 Torch 迭代过程中的踩坑记录，把常见风险归纳成可执行的 agent checklist，例如 checkpoint lifecycle、feature slot / dim 变化、optimizer state、训练配置一致性、runtime health、指标观察窗口等。这样不是靠人记住每个历史问题，而是让 agent 在合适的 DAG 节点自动提醒、检查和阻断高风险实验。\n长期来看，这套系统可以从单次实验辅助，扩展为完整的训练优化协作平台：自动读取历史 case 和实验结果，推荐下一步优化方向，生成可对比的实验组合，追踪训练运行状态，分析收益和风险，并把新的经验继续沉淀回知识库，形成一个越用越懂 Torch optim 的 agent team。", "impact": "该方案可以把 Torch optimizer 优化从“人工经验驱动”升级为“DAG 驱动的 agent 协作流程”。预期收益包括：缩短实验设计和排查周期，减少重复无效实验，提升 AUC 收益归因可信度，降低训练资源浪费，并让 checkpoint、feature、optimizer、runtime、metric analysis 等经验沉淀为可复用资产。\n最后交付agent team框架的目标是用现有Torch optim case展示端到端流程：从问题理解、历史证据整理、候选方案设计，到实验检查、结果分析和知识库更新，说明 Agent Team 如何把分散的优化经验转化为稳定、可复用的研发效率提升。", "subteam": "Search", "loc": "SH", "cap": "Sun Yawei (孙亚威)", "members": [["Sun Yawei (孙亚威)", "Search / Algo / SH"], ["Lan Zhonghao (兰中豪)", "Search / Algo / SH"], ["Zhu Yirui (朱一睿)", "Search / Algo / SH"], ["Zhou Guoliang (周国亮)", "Search / Algo / SH"]], "size": 4}, {"id": 15, "track": 3, "name": "Recall Queue Full-Cost Accounting", "title": "Recall Queue Full-Cost Accounting", "problem": "在业务系统中，一个线上模块背后往往依赖多路召回或策略链路。这些链路分散在不同平台和账单体系中，缺少统一的链路识别、成本归因和效果评估方法，导致团队很难整体了解不同召回链路的资源开销、业务收益和 ROI。随着系统长期迭代，召回链路数量不断增加，容易出现链路冗余、低效资源长期保留、优化决策依赖人工经验、资源浪费难以及时发现等问题。", "approach": "构建 Recall Queue 全链路成本记账和实验优化 Agent。Agent基于入口服务配置，全自动识别召回链路，串联相关离线任务、存储资源、在线服务、实验配置和效果指标，形成可解释的链路图与“成本工资条”，并结合业务贡献输出 ROI 分析和优化候选。在线 AB 优化场景中，Agent 支持半自动实验配置、白名单验证、请求命中确认和链路行为校验，形成从“发现问题”到“实验验证”再到“成本回收确认”的闭环。", "impact": "让召回队列成本从“分散账单、人工估算”变成“链路清楚、口径统一、可复查”的成本工资条，帮助团队快速识别高成本低贡献队列、幽灵队列和资源浪费等优化机会。项目将提升成本解释的可信度，减少人工跨平台排查成本，并为后续 AB 实验、资源下线、任务降配提供标准流程。最终目标是在不损伤业务效果的前提下，降低召回链路成本与资源浪费，并为召回链路优化提供更整体的决策视角。", "subteam": "Search", "loc": "SH / SG", "cap": "Zou Zongzheng (邹宗政)", "members": [["Zou Zongzheng (邹宗政)", "Search / Algo / SH"], ["Eric Wang Peng", "Search / Algo / SG"], ["Gu Jingzhao (谷京兆)", "Search / Algo / SH"], ["Huang Honglan (黄鸿蓝)", "Search / Algo / SH"], ["Guo Sijie (郭思捷)", "Search / Algo / SH"]], "size": 5}, {"id": 16, "track": 3, "name": "ContentAds Autopilot", "title": "ContentAds Autopilot: Guardrailed Self-Evolving Optimization for Ads Ranking / ContentAds Autopilot：面向广告排序的带护栏自进化优化系统", "problem": "Content Ads ranking contains many business-sensitive parameters, such as pCR coefficient, eGMV weight, pCTR/relevance thresholds, dynamic eCPM thresholds, and auto-bid coefficients. These parameters affect revenue, clicks, orders, CTR, CVR, and user experience, but today the tuning process is still largely manual and experience-driven.\nContent Ads 排序中有大量业务敏感参数，例如 pCR 系数、eGMV 权重、pCTR/相关性阈值、dynamic eCPM 阈值、auto-bid 系数等。这些参数会影响收入、点击、订单、CTR、CVR 和用户体验，但当前调优过程仍然主要依赖人工和经验。\nThe online environment is not static. Traffic mix, seller bidding behavior, campaign intensity, pCOC, marketplace seasonality, and special sale days can all shift quickly. A parameter setting that works well in one period may become suboptimal, or even risky, when the online regime changes.\n线上环境并不是静态的。流量结构、卖家出价行为、活动强度、pCOC、市场季节性以及大促节点都可能快速变化。某个阶段表现好的参数配置，在另一个线上环境下可能变得不再最优，甚至带来风险。\nEngineers need to repeatedly pull metrics, compare AB groups, judge noisy short-window signals, update configs, verify the change, and remember which parameter moves worked or failed across countries, lanes, and traffic regimes.\n工程师需要反复拉取指标、对比 AB 组、判断噪声较大的短周期信号、更新配置、校验改动，并记住不同国家、lane 和流量环境下哪些参数调整有效或无效。\nThis makes tuning slow, reactive, and hard to scale. Unsafe changes may hurt business metrics, while overly conservative tuning may leave optimization opportunities unused, especially during campaigns or traffic regime shifts when the system needs to adapt quickly.\n这会导致调优周期慢、偏被动、难以规模化。不安全的改动可能伤害业务指标，而过于保守的调优又可能错过优化机会，尤其是在活动期或流量环境变化时，系统更需要快速自适应。\nFor hackathon execution, we focus on Shop Ads as the first concrete Content Ads scenario, because it already has live AB groups, tunable ranking parameters, measurable business metrics, and clear guardrail requirements.\n在本次 hackathon 的执行中，我们会以 Shop Ads 作为第一个具体的 Content Ads 场景，因为它已经具备线上 AB 组、可调排序参数、可衡量业务指标和明确的安全护栏需求。", "approach": "Build ContentAds Autopilot as a standalone always-on optimization service. The long-term vision is to support Content Ads ranking optimization broadly, while the hackathon MVP executes on Shop Ads ranking parameter tuning.\n构建 ContentAds Autopilot 作为一个独立常驻的优化服务。长期目标是支持更广泛的 Content Ads 排序优化，而 hackathon MVP 会先落地在 Shop Ads 排序参数调优上。\nThe system runs in a closed loop every 3-6 hours: observe, validate, learn, decide, apply, protect, and evolve.\n系统每 3-6 小时运行一次闭环流程：观察、校验、学习、决策、应用、保护和进化。\nIt observes recent experiment metrics grouped by AB group, country, and lane, including revenue proxy, clicks, orders, CTR/CVR, fill, pick-rate, and ranking funnel signals.\n它会按 AB 组、国家和 lane 观察近期实验指标，包括收入 proxy、点击、订单、CTR/CVR、填充率、pick-rate 和排序漏斗信号。\nIt validates whether experiment deltas are meaningful by comparing against base and base_aa noise floor, checking sample size, and separating fast signals from longer-window contextual metrics.\n它会通过对比 base 和 base_aa 噪声基线、检查样本量，并区分快速信号和长周期上下文指标，判断实验差异是否可信。\nIt learns from each round by updating a memory system containing current state, parameter beliefs, experiment theories, settled learnings, refuted configs, and historical logs.\n它会从每一轮实验中学习，更新一套记忆系统，包括当前状态、参数 belief、实验假设、已确认结论、已否定配置和历史日志。\nIt decides the next action using an explore/exploit strategy: keep the best-known configuration stable, while using selected experiment groups to safely explore high-information-gain parameter moves.\n它会用 explore/exploit 策略决定下一步：保持当前最佳配置稳定，同时使用部分实验组安全探索信息增益较高的参数调整。\nIt applies changes only within hard guardrails: max step size, min/max parameter thresholds, no-touch control groups, minimum sample requirements, no-repeat failed configs, read-back verification, and automatic rollback when revenue, clicks, orders, or CTR drop too much.\n它只会在严格护栏内应用改动：单次最大步长、参数上下界、不可触碰 control 组、最小样本量要求、不重复失败配置、写入后 read-back 校验，以及当收入、点击、订单或 CTR 下跌过多时自动回滚。", "impact": "ContentAds Autopilot can continuously improve online AB test results by adapting ranking parameters to changing traffic, campaign, and marketplace conditions.\nContentAds Autopilot 可以根据流量、活动和市场环境变化，持续调整排序参数，从而改善线上 AB 实验结果。\nFor the Shop Ads MVP, the main observable impact will be positive lifts in revenue proxy, CTR, CVR, clicks, and orders, while keeping downside risk controlled by guardrails and auto-rollback.\n对于 Shop Ads MVP，主要可观测收益会体现在 revenue proxy、CTR、CVR、点击和订单的正向提升，同时通过护栏和自动回滚控制下行风险。\nThe agent can react when online conditions shift, such as campaign days, traffic mix changes, seller bid changes, or pCOC movement, instead of relying on one static parameter setting.\n当线上环境变化时，例如活动日、流量结构变化、卖家出价变化或 pCOC 波动，Agent 可以动态适应，而不是依赖一套静态参数配置。\nBy learning from each experiment round, it can discover which parameter changes work under different regimes, avoid repeating bad configs, and keep improving the explore/exploit strategy over time.\n通过从每轮实验中学习，它可以发现不同环境下哪些参数调整有效，避免重复失败配置，并持续优化 explore/exploit 策略。\nBetter pCOC estimation and adaptive ranking coefficients can help balance monetization and relevance, improving revenue without sacrificing user engagement or conversion quality.\n更好的 pCOC 判断和自适应排序系数可以帮助平衡商业化和相关性，在提升收入的同时尽量不牺牲用户参与度和转化质量。", "subteam": "Ads", "loc": "SG", "cap": "Li Sheng", "members": [["Li Sheng", "Ads / Algo / SG"], ["Chen Jia Wei", "Ads / Algo / SG"]], "size": 2}, {"id": 17, "track": 3, "name": "Team Ornn", "title": "Agent Skill Auto Evolution Platform", "problem": "agent的skill的迭代如何保证效果正向？能否让skill进行自主进化", "approach": "通过大模型不断尝试改写优化skill，并将skill迭代与实际应用的实验指标/回测效果整合，获取最优skill", "impact": "1. 实验调参等可以自动动态优化   2. 工程自动debug等agent能够有更强的完成任务的能力 3. 现有的agent技能库迭代确保质量上升，任务完成率/效果优化", "subteam": "Search", "loc": "SH", "cap": "Shi Yifan (施奕帆)", "members": [["Shi Yifan (施奕帆)", "Search / Algo / SH"], ["Li Wenwei (李汶蔚)", "Search / BE / SH"], ["Bright Chen (陈光明)", "Search / BE / SH"]], "size": 3}, {"id": 18, "track": 3, "name": "LabPilot", "title": "搭建以实验为中心的算法agent，包括各种skill以及知识库，覆盖实验准备、上线、验证、分析、总结所有操作环节，提升实验效率，实现实验全生命周期监控、落盘、追溯、分析以及经验知识提取。", "problem": "目前算法同学做实验时，实验准备、上线、验证、分析、总结五个环节都是割裂的、碎片化的，在不同平台上操作，会导致以下问题：\n1. 迭代效率低，需要频繁切换平台\n2. 目前的agent难以聚合实验各阶段的信息，只能基于各阶段局部信息做出分析，影响分析质量\n3. 难以自动将每次完整实验知识化，如果想完整记录实验过程，需要人工记录\n4. 不方便实验成果分享", "approach": "搭建以实验为中心的算法agent，设计各种skill，覆盖实验准备、上线、验证、分析、总结全链路，支持断点操作，下次能继续操作某个实验，以对话形式完成实验各步骤，减少平台切换，提升实验效率。同时搭建看板实现对实验全生命周期监控、记录所有实验相关信息。通过该方案可以有效解决上面提到的问题。", "impact": "1. 提升实验效率 x2\n2. agent自动出具完整实验报告、归因\n     <div class="dbody">${day.ids.map((id,i)=>{const t=T(id);return `<div class="slot">
        <span class="sn">${i+1}</span>
        <span class="snm"><span class="tdot" style="display:inline-block;background:${tk(t.track).color}"></span> ${esc(t.name)}</span>
        <span class="sc">${esc(t.title.length>90?t.title.slice(0,90)+'…':t.title)}</span>
        <span class="sl">${esc(t.cap)} · ${esc(t.loc)} · ${t.size}${LANG==='cn'?'人':''}</span>
      </div>`}).join('')}</div></div>`).join('')
   + `<p class="note">${d.dnote}</p>`;
}

function render(){
  head();
  document.getElementById('view').innerHTML =
    TAB==='tracks'?viewTracks():TAB==='teams'?viewTeams():viewDemo();
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-tab]');       if(b){TAB=b.dataset.tab;render();return;}
  const g=e.target.closest('[data-goto]');      if(g){TAB='teams';FT=0;FL='ALL';Q=T(+g.dataset.goto).name;render();
      const el=document.querySelector('[data-team]'); if(el)el.classList.add('open'); return;}
  const ft=e.target.closest('[data-ft]');       if(ft){FT=+ft.dataset.ft;render();return;}
  const fl=e.target.closest('[data-fl]');       if(fl){FL=fl.dataset.fl;render();return;}
  const tg=e.target.closest('[data-toggle]');   if(tg){tg.parentElement.classList.toggle('open');return;}
  const dt=e.target.closest('[data-dtoggle]');  if(dt){dt.parentElement.classList.toggle('open');return;}
  if(e.target.id==='lang'){LANG=LANG==='cn'?'en':'cn';render();}
});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){Q=e.target.value;const p=e.target.selectionStart;render();
    const n=document.getElementById('q');n.focus();n.setSelectionRange(p,p);}
});
render();
</script>
</body></html>
